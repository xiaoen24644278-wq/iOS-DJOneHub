name: DJOneHub
options:
  bundleIdPrefix: com.djonehub
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  objectVersion: 60

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    INFOPLIST_FILE: DJOneHub/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_EMIT_LOC_STRINGS: YES
    GCC_PREPROCESSOR_DEFINITIONS: ""
    OTHER_LDFLAGS: ""
    FRAMEWORK_SEARCH_PATHS: ""
    LIBRARY_SEARCH_PATHS: ""
    HEADER_SEARCH_PATHS: ""
    USER_HEADER_SEARCH_PATHS: ""
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_MODULES_AUTOLINK: YES
    SWIFT_OBJC_BRIDGING_HEADER: ""
    SWIFT_OBJC_INTERFACE_HEADER_NAME: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.djonehub.ios
    PRODUCT_NAME: DJOneHub
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ONLY_ACTIVE_ARCH: YES
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      MTL_FAST_MATH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1"
      GCC_OPTIMIZATION_LEVEL: 0
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: YES
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      ONLY_ACTIVE_ARCH: NO
      MTL_ENABLE_DEBUG_INFO: NO
      MTL_FAST_MATH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      GCC_PREPROCESSOR_DEFINITIONS: ""
      GCC_OPTIMIZATION_LEVEL: s
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ENABLE_TESTABILITY: NO
      VALIDATE_PRODUCT: YES

targets:
  DJOneHub:
    type: application
    platform: iOS
    sources:
      - path: DJOneHub
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: DJOneHub/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.djonehub.ios
        PRODUCT_NAME: DJOneHub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: ExternalAccessory.framework
      - sdk: Contacts.framework
      - sdk: UserNotifications.framework
      - sdk: AVFoundation.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: Network.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: Combine.framework
