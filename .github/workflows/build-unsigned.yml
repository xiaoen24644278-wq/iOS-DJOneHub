name: Build unsigned archive and unsigned IPA

on:
  push:
    branches: [ ci/fix-build-compile ]
  workflow_dispatch: {}

jobs:
  build:
    name: Archive (unsigned) + unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v2
        with:
          xcode-version: '16.4'

      - name: Install dependencies (Carthage/CocoaPods/etc.)
        run: |
          echo "No additional dependency step configured."
        shell: bash

      - name: Build archive (unsigned)
        env:
          ARCHIVE_PATH: ${{ github.workspace }}/build/DJOneHub.xcarchive
        run: |
          set -e
          mkdir -p $(dirname "$ARCHIVE_PATH")
          xcodebuild -project DJOneHub.xcodeproj -scheme DJOneHub -configuration Release -destination "generic/platform=iOS" archive -archivePath "$ARCHIVE_PATH" CODE_SIGNING_ALLOWED=NO

      - name: Zip archive
        env:
          ARCHIVE_PATH: ${{ github.workspace }}/build/DJOneHub.xcarchive
          ARCHIVE_ZIP: ${{ github.workspace }}/build/DJOneHub.xcarchive.zip
        run: |
          set -e
          ditto -c -k --keepParent "$ARCHIVE_PATH" "$ARCHIVE_ZIP"

      - name: Create unsigned IPA from .app inside archive
        env:
          ARCHIVE_PATH: ${{ github.workspace }}/build/DJOneHub.xcarchive
          UNSIGNED_IPA: ${{ github.workspace }}/build/DJOneHub-unsigned.ipa
        run: |
          set -e
          APP_DIR=$(ls "$ARCHIVE_PATH/Products/Applications"/*.app | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "No .app found in archive at $ARCHIVE_PATH/Products/Applications"
            exit 1
          fi
          echo "Found app: $APP_DIR"
          mkdir -p build/Payload
          cp -R "$APP_DIR" build/Payload/
          pushd build
          # Create unsigned ipa by zipping the Payload folder
          zip -r "$(basename "$UNSIGNED_IPA")" Payload
          popd
          # move created zip to expected path
          mv build/$(basename "$UNSIGNED_IPA") "$UNSIGNED_IPA"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-artifacts
          path: |
            build/DJOneHub.xcarchive.zip
            build/DJOneHub-unsigned.ipa
